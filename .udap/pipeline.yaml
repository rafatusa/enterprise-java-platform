version: 1
name: enterprise-java-platform
vcs: github
rollback:
  strategy: rerun
stages:
  - id: build
    kind: build
    timeout_minutes: 25
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven build
        run: mvn -B -ntp clean compile

  - id: format
    kind: lint
    needs: [build]
    timeout_minutes: 15
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Spotless formatting check
        run: mvn -B -ntp spotless:check

  - id: static-analysis
    kind: lint
    needs: [build]
    timeout_minutes: 25
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Checkstyle, PMD, SpotBugs (reports always produced)
        run: bash scripts/ci/static-analysis.sh
      - name: Upload static analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: reports/static-analysis/
          retention-days: 30
      - name: Enforce static analysis gates
        run: bash scripts/ci/static-analysis-gate.sh

  - id: test
    kind: test
    needs: [build]
    timeout_minutes: 40
    env:
      SPRING_PROFILES_ACTIVE: test
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: JUnit 5, Mockito, Spring Boot IT, REST Assured
        run: bash scripts/ci/run-tests.sh
      - name: Upload test + JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-and-test-reports
          path: reports/tests/
          retention-days: 30
      - name: Enforce coverage gates (line 90% / branch 85%)
        run: mvn -B -ntp jacoco:check

  - id: contract-tests
    kind: test
    needs: [build]
    timeout_minutes: 20
    env:
      PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pact contract tests
        run: bash scripts/ci/contract-tests.sh
      - name: Upload Pact artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: reports/pacts/
          retention-days: 30

  - id: mutation
    kind: test
    needs: [test]
    timeout_minutes: 45
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: PIT mutation testing
        run: bash scripts/ci/mutation.sh
      - name: Upload PIT mutation report
        uses: actions/upload-artifact@v4
        with:
          name: pit-mutation-report
          path: reports/pit/
          retention-days: 30
      - name: Enforce mutation score >= 70%
        run: bash scripts/ci/mutation-gate.sh

  - id: sonarqube
    kind: lint
    needs: [test]
    timeout_minutes: 25
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: SonarQube analysis and quality gate
        run: bash scripts/ci/sonar.sh

  - id: secret-scan
    kind: security
    timeout_minutes: 15
    steps:
      - name: Gitleaks secret scan
        run: bash scripts/ci/gitleaks.sh
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/security/gitleaks/
          retention-days: 30
      - name: Fail on any detected secret
        run: bash scripts/ci/gitleaks-gate.sh

  - id: sast
    kind: security
    timeout_minutes: 20
    steps:
      - name: Semgrep SAST scan
        run: bash scripts/ci/semgrep.sh
      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: reports/security/semgrep/
          retention-days: 30
      - name: Fail on ERROR severity findings
        run: bash scripts/ci/semgrep-gate.sh

  - id: dependency-scan
    kind: security
    needs: [build]
    timeout_minutes: 45
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      # ==================================================================
      # TEMPORARY, USER-AUTHORISED WAIVER — REMOVE AFTER THE FIRST DEPLOY
      # ==================================================================
      # Set to "critical-only" on the explicit instruction of the
      # repository owner (2026-08-29), so that the configure/verify/perf
      # stages — which have never completed — can be exercised.
      #
      # WHAT IT DOES: dependency-scan-gate.sh downgrades HIGH-severity
      # findings to warnings. CRITICAL still hard-fails, and a scanner that
      # could not RUN still hard-fails. Both scanners still run at full
      # severity and every finding is still printed and uploaded.
      # failBuildOnCVSS in pom.xml is UNCHANGED at 7 and the Trivy
      # invocation still requests CRITICAL,HIGH. This is a
      # reporting-threshold waiver, not a weakened scanner.
      #
      # WHAT IT WAIVES: CVE-2026-65898 (7.2) — DOMPurify vendored inside the
      # swagger-ui webjar, which no springdoc release fixes (2.8.6 -> 2.8.17
      # moved swagger-ui 5.20.1 -> 5.32.2 and the CVE remained).
      # The pgjdbc HIGH that was also waived on the previous run has since
      # been FIXED by pinning postgresql.version to 42.7.13, and the two
      # Trivy IaC findings are handled explicitly in .trivyignore.
      #
      # TO RESTORE THE FULL GATE: delete this env var. That is the entire
      # revert. Do it as the very next change after the first green deploy.
      SECURITY_GATE_MODE: critical-only
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: OWASP Dependency Check, SBOM, Trivy filesystem
        run: bash scripts/ci/dependency-scan.sh
      - name: Upload security reports and SBOM
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-and-sbom
          path: reports/security/
          retention-days: 90
      - name: Fail on critical/high findings
        run: bash scripts/ci/dependency-scan-gate.sh

  - id: package
    kind: build_push
    needs: [format, static-analysis, test, mutation, contract-tests, sonarqube, secret-scan, sast, dependency-scan]
    timeout_minutes: 30
    env:
      IMAGE_TAG: ${{ github.sha }}
      REPO_OWNER: ${{ github.repository_owner }}
      # Same temporary waiver, same reason — see the note on dependency-scan.
      # CRITICAL findings still block the push to GHCR, and an unscanned
      # image is never published in any mode.
      SECURITY_GATE_MODE: critical-only
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package jar
        run: mvn -B -ntp clean package -DskipTests
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker build and Trivy container scan
        run: bash scripts/ci/docker-build-scan.sh
      - name: Upload container scan report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-report
          path: reports/security/trivy-image/
          retention-days: 90
      - name: Fail on container CRITICAL/HIGH, then push to GHCR
        run: bash scripts/ci/docker-push.sh

  - id: tf-check
    kind: custom
    needs: [package]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: 'false'
      - name: Terraform fmt, init, validate
        run: |
          cd infra
          terraform fmt -check -recursive
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform validate
      - name: Terraform plan
        run: |
          cd infra
          mkdir -p ../reports/terraform
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > ../reports/terraform/plan.txt
      - name: Upload terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: reports/terraform/
          retention-days: 30

  - id: provision
    kind: provision
    needs: [tf-check]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: 'false'
      - name: Terraform init
        run: |
          cd infra
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
      - name: Terraform apply
        run: |
          cd infra
          terraform apply -auto-approve -input=false

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_AUTH_PASSWORD: ${{ secrets.APP_AUTH_PASSWORD }}
      APP_VERSION: ${{ github.sha }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: 'false'
      - name: Read instance address
        id: infra
        run: |
          cd infra
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          echo "ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
      # Ansible is INVOKED VIA PATH, never via a hardcoded install prefix.
      # GitHub's ubuntu runner images ship ansible-core pre-installed under
      # /opt/pipx/venvs with its binaries already on PATH, so `pipx install`
      # correctly does nothing and ~/.local/bin/ansible-* NEVER EXISTS —
      # which is exactly how this stage failed with exit 127. Install only if
      # the binary is genuinely absent, then resolve everything through PATH.
      - name: Install Ansible and collections
        run: bash scripts/ci/install-ansible.sh
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ steps.infra.outputs.ip }}" >> ~/.ssh/known_hosts
      - name: Puppet bootstrap (base server configuration)
        run: |
          ansible-playbook -i "${{ steps.infra.outputs.ip }}," -u "$SSH_USER" \
            --private-key ~/.ssh/deploy_key ansible/puppet-bootstrap.yml
      - name: Ansible application deployment
        run: |
          ansible-playbook -i "${{ steps.infra.outputs.ip }}," -u "$SSH_USER" \
            --private-key ~/.ssh/deploy_key ansible/site.yml \
            -e "db_password=$DB_PASSWORD" \
            -e "jwt_secret=$JWT_SECRET" \
            -e "app_auth_password=$APP_AUTH_PASSWORD" \
            -e "app_version=$APP_VERSION"

  - id: verify
    kind: verify
    needs: [configure]
    timeout_minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      APP_AUTH_PASSWORD: ${{ secrets.APP_AUTH_PASSWORD }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: 'false'
      - name: Read instance address
        id: infra
        run: |
          cd infra
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          echo "ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
      # Same PATH discipline as configure — verify-with-rollback.sh shells out
      # to ansible-playbook for the rollback path, so it must resolve here too.
      - name: Install Ansible for the rollback path
        run: bash scripts/ci/install-ansible.sh
      - name: Prepare SSH access for the rollback path
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ steps.infra.outputs.ip }}" >> ~/.ssh/known_hosts
      - name: Health verification and smoke tests (auto-rollback on failure)
        env:
          TARGET_HOST: ${{ steps.infra.outputs.ip }}
        run: bash scripts/ci/verify-with-rollback.sh
      - name: Upload deployment summary
        uses: actions/upload-artifact@v4
        with:
          name: deployment-summary
          path: reports/deployment/
          retention-days: 90

  - id: perf
    kind: perf
    needs: [verify]
    timeout_minutes: 40
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      APP_AUTH_PASSWORD: ${{ secrets.APP_AUTH_PASSWORD }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: 'false'
      - name: Read instance address
        id: infra
        run: |
          cd infra
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          echo "ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
      - name: Install k6
        run: bash scripts/ci/install-k6.sh
      - name: k6 load test (200 VUs, 15 min)
        env:
          BASE_URL: http://${{ steps.infra.outputs.ip }}
        run: bash scripts/ci/k6-run.sh
      - name: Upload k6 performance report
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-report
          path: reports/performance/
          retention-days: 90
      - name: Enforce p95 < 400ms and error rate < 1%
        run: bash scripts/ci/k6-gate.sh

  - id: release
    kind: notify
    needs: [perf]
    timeout_minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release with all reports
        run: bash scripts/ci/create-release.sh
