        name: static-analysis-reports
        path: reports/static-analysis/
        retention-days: 30
    - name: Enforce static analysis gates
      run: bash scripts/ci/static-analysis-gate.sh
  test:
    runs-on: ubuntu-latest
    needs:
    - build
    env:
      SPRING_PROFILES_ACTIVE: test
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
    - name: JUnit 5, Mockito, Spring Boot IT, REST Assured
      run: bash scripts/ci/run-tests.sh
    - name: Upload test + JaCoCo reports
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-and-test-reports
        path: reports/tests/
        retention-days: 30
    - name: Enforce coverage gates (line 90% / branch 85%)
      run: mvn -B -ntp jacoco:check
  contract-tests:
    runs-on: ubuntu-latest
    needs:
    - build
    env:
      PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
    - name: Pact contract tests
      run: bash scripts/ci/contract-tests.sh
    - name: Upload Pact artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pact-contracts
        path: reports/pacts/
        retention-days: 30
  mutation:
    runs-on: ubuntu-latest
    needs:
    - test
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
    - name: PIT mutation testing
      run: bash scripts/ci/mutation.sh
    - name: Upload PIT mutation report
      uses: actions/upload-artifact@v4
      with:
        name: pit-mutation-report
        path: reports/pit/
        retention-days: 30
    - name: Enforce mutation score >= 70%
      run: bash scripts/ci/mutation-gate.sh
  sonarqube:
    runs-on: ubuntu-latest
    needs:
    - test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
    - name: SonarQube analysis and quality gate
      run: bash scripts/ci/sonar.sh
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Gitleaks secret scan
      run: bash scripts/ci/gitleaks.sh
    - name: Upload Gitleaks report
      uses: actions/upload-artifact@v4
      with:
        name: gitleaks-report
        path: reports/security/gitleaks/
        retention-days: 30
    - name: Fail on any detected secret
      run: bash scripts/ci/gitleaks-gate.sh
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Semgrep SAST scan
      run: bash scripts/ci/semgrep.sh
    - name: Upload Semgrep report
      uses: actions/upload-artifact@v4
      with:
        name: semgrep-report
        path: reports/security/semgrep/
        retention-days: 30
    - name: Fail on ERROR severity findings
      run: bash scripts/ci/semgrep-gate.sh
  dependency-scan:
    runs-on: ubuntu-latest
    needs:
    - build
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
    - name: OWASP Dependency Check, SBOM, Trivy filesystem
      run: bash scripts/ci/dependency-scan.sh
    - name: Upload security reports and SBOM
      uses: actions/upload-artifact@v4
      with:
        name: security-reports-and-sbom
        path: reports/security/
        retention-days: 90
    - name: Fail on critical/high findings
      run: bash scripts/ci/dependency-scan-gate.sh
  package:
    runs-on: ubuntu-latest
    needs:
    - format
    - static-analysis
    - test
    - mutation
    - contract-tests
    - sonarqube
    - secret-scan
    - sast
    - dependency-scan
    env:
      IMAGE_TAG: ${{ github.sha }}
      REPO_OWNER: ${{ github.repository_owner }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
    - name: Package jar
      run: mvn -B -ntp clean package -DskipTests
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Docker build and Trivy container scan
      run: bash scripts/ci/docker-build-scan.sh
    - name: Upload container scan report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-container-report
        path: reports/security/trivy-image/
        retention-days: 90
    - name: Fail on container CRITICAL/HIGH, then push to GHCR
      run: bash scripts/ci/docker-push.sh
  tf-check:
    runs-on: ubuntu-latest
    needs:
    - package
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: 'false'
    - name: Terraform fmt, init, validate
      run: "cd infra\nterraform fmt -check -recursive\nterraform init -input=false\
        \ -reconfigure \\\n  -backend-config=\"bucket=${{ secrets.TF_STATE_BUCKET\
        \ }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME }}/terraform.tfstate\"\
        \ \\\n  -backend-config=\"region=$AWS_REGION\"\nterraform validate\n"
    - name: Terraform plan
      run: 'cd infra

        mkdir -p ../reports/terraform

        terraform plan -input=false -no-color -out=tfplan

        terraform show -no-color tfplan > ../reports/terraform/plan.txt

        '
    - name: Upload terraform plan
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan
        path: reports/terraform/
        retention-days: 30
  provision:
    runs-on: ubuntu-latest
    needs:
    - tf-check
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: 'false'
    - name: Terraform init
      run: "cd infra\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=$AWS_REGION\"\n"
    - name: Terraform apply
      run: 'cd infra

        terraform apply -auto-approve -input=false

        '
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_AUTH_PASSWORD_HASH: ${{ secrets.APP_AUTH_PASSWORD_HASH }}
      APP_VERSION: ${{ github.sha }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: 'false'
    - id: infra
      name: Read instance address
      run: "cd infra\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=$AWS_REGION\"\necho\
        \ \"ip=$(terraform output -raw public_ip)\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Install Ansible and collections
      run: 'pipx install ansible-core

        ~/.local/bin/ansible-galaxy collection install community.general community.postgresql

        '
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "${{ steps.infra.outputs.ip }}" >> ~/.ssh/known_hosts

        '
    - name: Puppet bootstrap (base server configuration)
      run: "~/.local/bin/ansible-playbook -i \"${{ steps.infra.outputs.ip }},\" -u\
        \ \"$SSH_USER\" \\\n  --private-key ~/.ssh/deploy_key ansible/puppet-bootstrap.yml\n"
    - name: Ansible application deployment
      run: "~/.local/bin/ansible-playbook -i \"${{ steps.infra.outputs.ip }},\" -u\
        \ \"$SSH_USER\" \\\n  --private-key ~/.ssh/deploy_key ansible/site.yml \\\n\
        \  -e \"db_password=$DB_PASSWORD\" \\\n  -e \"jwt_secret=$JWT_SECRET\" \\\n\
        \  -e \"app_auth_password_hash=$APP_AUTH_PASSWORD_HASH\" \\\n  -e \"app_version=$APP_VERSION\"\
        \n"
  verify:
    runs-on: ubuntu-latest
    needs:
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      APP_AUTH_PASSWORD: ${{ secrets.APP_AUTH_PASSWORD }}
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: 'false'
    - id: infra
      name: Read instance address
      run: "cd infra\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=$AWS_REGION\"\necho\
        \ \"ip=$(terraform output -raw public_ip)\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Install Ansible for the rollback path
      run: 'pipx install ansible-core

        mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "${{ steps.infra.outputs.ip }}" >> ~/.ssh/known_hosts

        '
    - name: Health verification and smoke tests (auto-rollback on failure)
      run: bash scripts/ci/verify-with-rollback.sh
      env:
        TARGET_HOST: ${{ steps.infra.outputs.ip }}
    - name: Upload deployment summary
      uses: actions/upload-artifact@v4
      with:
        name: deployment-summary
        path: reports/deployment/
        retention-days: 90
  perf:
    runs-on: ubuntu-latest
    needs:
    - verify
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      APP_AUTH_PASSWORD: ${{ secrets.APP_AUTH_PASSWORD }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: 'false'
    - id: infra
      name: Read instance address
      run: "cd infra\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=$AWS_REGION\"\necho\
        \ \"ip=$(terraform output -raw public_ip)\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Install k6
      run: bash scripts/ci/install-k6.sh
    - name: k6 load test (200 VUs, 15 min)
      run: bash scripts/ci/k6-run.sh
      env:
        BASE_URL: http://${{ steps.infra.outputs.ip }}
    - name: Upload k6 performance report
      uses: actions/upload-artifact@v4
      with:
        name: k6-performance-report
        path: reports/performance/
        retention-days: 90
    - name: Enforce p95 < 400ms and error rate < 1%
      run: bash scripts/ci/k6-gate.sh
  release:
    runs-on: ubuntu-latest
    needs:
    - perf
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Download all reports
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts
    - name: Create GitHub Release with all reports
      run: bash scripts/ci/create-release.sh
