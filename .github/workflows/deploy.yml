name: deploy
'on':
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
    - name: Maven build
      run: mvn -B -ntp clean compile
  format:
    runs-on: ubuntu-latest
    needs:
    - build
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
    - name: Spotless formatting check
      run: mvn -B -ntp spotless:check
  static-analysis:
    runs-on: ubuntu-latest
    needs:
    - build
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
    - name: Checkstyle, PMD, SpotBugs (reports always produced)
      run: bash scripts/ci/static-analysis.sh
    - name: Upload static analysis reports
      uses: actions/upload-artifact@v4
