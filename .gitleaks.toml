# Gitleaks configuration for enterprise-java-platform.
#
# Extends the upstream default ruleset (AWS keys, GitHub tokens, private keys,
# JWTs and ~150 other providers) and adds narrowly-scoped allowlists for values
# that are provably not credentials.
#
# The project deliberately contains NO key-shaped literals in application code:
# test signing keys are derived at runtime by com.example.app.support.TestKeys,
# and the test operator password is generated by TestCredentials. That design is
# what keeps this allowlist short — every entry here is a specific, explained
# exception rather than a broad path exclusion that would let a real leak
# through.
#
# RULE FOR FUTURE EDITS: never add an entry to silence a finding you have not
# read. Print the finding first (gitleaks-gate.sh names file:line and rule),
# confirm it is prose or a derived value, and then say WHY here.

[extend]
useDefault = true

[allowlist]
description = "Documented non-secrets"

paths = [
  # Generated reports and build output contain hashes and base64 blobs that trip
  # entropy rules. Not first-party code; nothing here is fixable by us.
  '''^reports/''',
  '''^target/''',

  # Engineering notes and operator documentation. These describe the credential
  # MECHANISM ("app_auth_password is hashed with password_hash('bcrypt') on the
  # host", "JWT_SECRET must be >= 32 bytes for HS256") and quote secret NAMES,
  # never values. Prose of this shape reliably trips generic high-entropy rules.
  # The no-secrets-in-notes rule is enforced by review, not by this scanner.
  '''^\.udap/notes\.md$''',
  '''^docs/troubleshooting\.md$''',
  '''^docs/operations\.md$''',
]

regexes = [
  # Test-profile JWT signing key (src/test/resources/application-test.properties).
  # Signs nothing outside the H2-backed test profile; the runtime key comes from
  # the JWT_SECRET repository secret.
  '''test-profile-hs256-key-padding-value-abcdefghijklmnopqrstuvwxyz012345''',

  # Explicit "this is not set" placeholder for the test operator hash. The real
  # value is computed by the TestCredentials initializer at context startup.
  '''unset-apply-TestCredentials-initializer''',

  # GitHub Actions secret REFERENCES are not secret values.
  '''\$\{\{\s*secrets\.[A-Z0-9_]+\s*\}\}''',
]
