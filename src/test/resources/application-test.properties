# Tests run against in-memory H2 in PostgreSQL compatibility mode so the CI
# quality stages need no database service container. Flyway is disabled here and
# Hibernate creates the schema — the real PostgreSQL schema is verified on the
# deployed host by the smoke tests, which is where it actually matters.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

server.address=127.0.0.1

# Signing key for the test profile only; the runtime key comes from JWT_SECRET.
app.jwt.secret=test-profile-hs256-key-padding-value-abcdefghijklmnopqrstuvwxyz012345
app.jwt.ttl-seconds=3600

# app.auth.username and app.auth.password-hash are supplied by
# com.example.app.support.TestCredentials (an ApplicationContextInitializer) so
# the plaintext and its bcrypt hash are derived from ONE constant and cannot
# drift apart.
#
# There is deliberately NO literal hash fallback here. A pasted bcrypt hash whose
# plaintext nobody can verify is unusable as a fixture: every login returns 401
# and the failure reads like a security misconfiguration. Any test that needs to
# authenticate must apply the initializer.
app.auth.username=operator
app.auth.password-hash=unset-apply-TestCredentials-initializer

logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
