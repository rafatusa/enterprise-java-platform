spring.application.name=enterprise-java-platform

# Bind loopback only: nginx is the sole public entry point (80/443).
server.address=127.0.0.1
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# --- Datasource (values supplied by /opt/app/shared/app.env in production) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway owns the schema; Hibernate only validates against it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# --- Actuator: health, info and readiness/liveness probes ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

info.app.name=enterprise-java-platform
info.app.description=Enterprise Spring Boot platform with full quality and security gates
info.app.version=@project.version@

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- Security ---
# All three values are REQUIRED from the environment in any real deployment and
# have no usable defaults on purpose: a default signing key or a default operator
# credential that "works out of the box" is a backdoor that ships to production
# the first time someone forgets to set a secret. Ansible writes all three into
# /opt/app/shared/app.env from repository secrets; the app fails fast without them.
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
app.auth.username=${APP_AUTH_USER:operator}
app.auth.password-hash=${APP_AUTH_PASSWORD_HASH}

# Do not leak stack traces to clients.
server.error.include-stacktrace=never
server.error.include-message=always

logging.level.root=INFO
logging.level.com.example.app=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
