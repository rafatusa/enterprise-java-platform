---
# PostgreSQL database and role.
#
# Puppet installed and started the server; this role owns the APPLICATION's
# database objects, which are deploy-time concerns rather than machine state.
#
# community.postgresql modules are used and are installed by the configure stage
# alongside ansible-core (ansible-core ships no third-party collections).

- name: Ensure PostgreSQL is running
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true

- name: Wait for PostgreSQL to accept connections
  ansible.builtin.wait_for:
    port: 5432
    host: 127.0.0.1
    timeout: 60

# Detect the installed major version rather than hardcoding it: Ubuntu 22.04
# ships 14 today, but pinning a config path that moves on a base-image refresh
# is a deploy that breaks for no reason months later.
- name: Detect the PostgreSQL major version
  ansible.builtin.shell:
    cmd: set -o pipefail && pg_config --version | awk '{print $2}' | cut -d. -f1
    executable: /bin/bash
  register: pg_version
  changed_when: false

- name: Create the application database
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    encoding: UTF-8
    state: present
  become_user: postgres

- name: Create the application role
  community.postgresql.postgresql_user:
    db: "{{ db_name }}"
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE
    state: present
  become_user: postgres
  no_log: true

- name: Grant the application role rights on its database
  community.postgresql.postgresql_privs:
    db: "{{ db_name }}"
    role: "{{ db_user }}"
    type: database
    privs: CONNECT,TEMPORARY
    state: present
  become_user: postgres

- name: Grant schema privileges to the application role
  community.postgresql.postgresql_privs:
    db: "{{ db_name }}"
    role: "{{ db_user }}"
    type: schema
    objs: public
    privs: CREATE,USAGE
    state: present
  become_user: postgres

- name: Bind PostgreSQL to localhost only
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ pg_version.stdout | trim }}/main/postgresql.conf"
    regexp: '^#?listen_addresses'
    line: "listen_addresses = 'localhost'"
    state: present
  notify: Restart postgresql

- name: Log slow queries (>1s) for operational diagnosis
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ pg_version.stdout | trim }}/main/postgresql.conf"
    regexp: '^#?log_min_duration_statement'
    line: 'log_min_duration_statement = 1000'
    state: present
  notify: Restart postgresql

- name: Flush handlers so the database is ready before the app deploys
  ansible.builtin.meta: flush_handlers
